[package]
name = "zvec-rust-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# the safe bindings that the zvec team publishes, at the version that scripts/update-zvec-rust.sh
# pins. Their default feature `bundled` makes the build script of zvec-rust-sys download or build
# the library, so it is off: the library is the one that Nix builds (ZVEC_LIB_DIR).
zvec-rust = { version = "=0.8.0", default-features = false }

# a workspace of its own, like the other Rust examples of this repository
[workspace]
