name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# These jobs build no DuckDB, no NeuG and no zvec (its C library, and the tests of
# it and of its Rust crates): a full build with the test suite takes hours and
# does not fit a hosted runner (see "CI" in docs/packaging.md). They cover
# what breaks without one: style, evaluation, the pins and patches of every
# extension, CMake configuring DuckDB with all the extensions, and chDB, which is
# a binary that is fetched, not built.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command scripts/lint.sh

  # Every package and check of every system evaluates. Import from derivation is
  # off, as Hydra has it: evaluating must not build.
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-build --all-systems --option allow-import-from-derivation false

  # Each extension's source with its pin and patches applied, and the check that
  # the pins are the commits DuckDB's release names.
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          sources="$(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames |
            jq --raw-output '.[] | select(startswith("source-")) | ".#packages.x86_64-linux." + .')"
          # shellcheck disable=SC2086 # one argument for each line
          # the pins check of every version on every nixpkgs
          pins="$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames |
            jq --raw-output '.[] | select(test("extension-pins")) | ".#checks.x86_64-linux." + .')"
          # shellcheck disable=SC2086 # one argument for each line
          nix build --no-link --print-build-logs $sources $pins

  # CMake configures DuckDB with every extension each nixpkgs can build, which
  # finds a missing dependency or a changed option without compiling anything.
  configure:
    name: configure (${{ matrix.nixpkgs }}, DuckDB ${{ matrix.duckdb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nixpkgs: unstable
            duckdb: "2.0"
            package: dev-configure
          - nixpkgs: stable
            duckdb: "2.0"
            package: stable-dev-configure
          - nixpkgs: previous
            duckdb: "2.0"
            package: previous-dev-configure
          # the other versions of DuckDB, on every nixpkgs
          - nixpkgs: unstable
            duckdb: "1.5"
            package: dev-configure-1_5
          - nixpkgs: stable
            duckdb: "1.5"
            package: stable-dev-configure-1_5
          - nixpkgs: previous
            duckdb: "1.5"
            package: previous-dev-configure-1_5
          - nixpkgs: unstable
            duckdb: "1.4"
            package: dev-configure-1_4
          - nixpkgs: stable
            duckdb: "1.4"
            package: stable-dev-configure-1_4
          - nixpkgs: previous
            duckdb: "1.4"
            package: previous-dev-configure-1_4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build --no-link --print-build-logs .#${{ matrix.package }}

  # chDB is the upstream's prebuilt library, pinned by hash: building it fetches
  # 180 MB, checks the hash and patches the binary, and the check links a C
  # program to it and runs a query.
  chdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build --no-link --print-build-logs .#chdb .#checks.x86_64-linux.chdb-library
